{% extends "base.html" %}{% block title %}Join AFTERDARK{% endblock %}{% block body %}<section class="wrap"><div class="panel" style="max-width:700px;margin:auto"><div class="eyebrow">JOIN AFTERDARK</div><h1 style="font:700 42px Georgia,serif">Create your account</h1><form method="post"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Account type</label><select name="role" id="role" onchange="toggleProvider()"><option value="customer">Customer</option><option value="provider">Professional / Artist</option></select></div><div id="providerFields" style="display:none"><div class="field"><label>Business / artist name</label><input name="name"></div><div class="field"><label>Category</label><select name="category"><option>Tattoo Artist</option><option>Body Piercer</option><option>Alternative Beauty</option><option>Artist / Creative</option><option>Fashion / Jewellery</option><option>Event Organiser</option></select></div><div class="field"><label>Bio</label><textarea name="bio" rows="4"></textarea></div><div class="field"><label>Instagram / website</label><input name="social"></div><div class="field"><label>Aesthetics</label><input name="aesthetics" value="Gothic"></div></div><button class="btn">Create account</button></form></div></section><script>function toggleProvider(){document.getElementById('providerFields').style.display=document.getElementById('role').value==='provider'?'block':'none'}</script>{% endblock %}
